<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivos compartidos</title>
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e13" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --glow-1:rgba(99,102,241,.16); --glow-2:rgba(236,72,153,.10);
  --card:#ffffff; --card-2:#f8f9fc; --tx:#12141c; --mu:#667085; --bd:#e7e9f0; --bd-2:#d6d9e3;
  --ac:#4f46e5; --ac-2:#7c3aed; --ac-tx:#ffffff; --ac-soft:rgba(79,70,229,.08);
  --danger:#d92d20; --ok:#079455;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px -4px rgba(16,24,40,.06);
  --shadow-lg:0 2px 4px rgba(16,24,40,.04),0 16px 40px -12px rgba(16,24,40,.14);
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0e13; --glow-1:rgba(99,102,241,.20); --glow-2:rgba(236,72,153,.09);
  --card:#16181f; --card-2:#1c1f28; --tx:#eceef5; --mu:#9aa1b4; --bd:#252833; --bd-2:#333746;
  --ac:#8b8cf8; --ac-2:#b18cf8; --ac-tx:#0d0e13; --ac-soft:rgba(139,140,248,.12);
  --danger:#f97066; --ok:#47cd89;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px -4px rgba(0,0,0,.4);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 20px 44px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--tx); line-height:1.5;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(900px 420px at 15% -10%,var(--glow-1),transparent 70%),
    radial-gradient(700px 380px at 95% -5%,var(--glow-2),transparent 70%),
    var(--bg);
  background-repeat:no-repeat; -webkit-font-smoothing:antialiased;
}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}
svg{display:block;flex:none}
button{font:inherit}
[hidden]{display:none!important}

/* ---------- Header ---------- */
.hero{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.logo{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(135deg,#6366f1,#a855f7 60%,#ec4899);
  box-shadow:0 8px 20px -6px rgba(124,58,237,.55),inset 0 1px 0 rgba(255,255,255,.25);
}
h1{font-size:clamp(1.5rem,4.5vw,2rem);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.025em}
.sub{color:var(--mu);margin:4px 0 0;font-size:.95rem}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow)}
.composer{padding:16px}

/* Drop zone */
.drop{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:30px 16px;border-radius:14px;cursor:pointer;text-align:center;
  border:1.5px dashed var(--bd-2);background:var(--card-2);
  transition:border-color .2s,background .2s,transform .2s;
}
.drop:hover,.drop:focus-visible{border-color:var(--ac);background:var(--ac-soft);outline:none}
.drop.on{border-color:var(--ac);background:var(--ac-soft);transform:scale(1.01)}
.drop-ico{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);color:var(--ac);border:1px solid var(--bd);box-shadow:var(--shadow);
  transition:transform .25s;
}
.drop:hover .drop-ico,.drop.on .drop-ico{transform:translateY(-3px)}
.drop-t{font-weight:600}
.drop-t u{color:var(--ac);text-decoration:none}
.meta{color:var(--mu);font-size:.84rem}

/* File row */
.file{display:flex;gap:12px;align-items:center;min-width:0}
.sel{margin-top:12px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card-2);animation:pop .25s ease}
.grow{flex:1;min-width:0}
.fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
  font-size:.66rem;font-weight:800;letter-spacing:.04em;color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 22%,transparent);
}
.k-img{--c:#0e9384}.k-vid{--c:#e31b54}.k-aud{--c:#dc6803}.k-pdf{--c:#d92d20}
.k-zip{--c:#7a5af8}.k-doc{--c:#2e90fa}.k-xls{--c:#079455}.k-ppt{--c:#ef6820}.k-etc{--c:#667085}
@media (prefers-color-scheme:dark){
  .k-img{--c:#2ed3b7}.k-vid{--c:#fd6f8e}.k-aud{--c:#fdb022}.k-pdf{--c:#f97066}
  .k-zip{--c:#9b8afb}.k-doc{--c:#53b1fd}.k-xls{--c:#47cd89}.k-ppt{--c:#ff9c66}.k-etc{--c:#98a2b3}
}

/* Inputs & buttons */
textarea{
  display:block;width:100%;margin-top:12px;padding:12px 14px;min-height:76px;resize:vertical;
  border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;
  transition:border-color .2s,box-shadow .2s;
}
textarea::placeholder{color:var(--mu)}
textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:12px;border:0;cursor:pointer;font-weight:600;font-size:.92rem;
  color:var(--ac-tx);background:linear-gradient(135deg,var(--ac),var(--ac-2));
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--ac) 70%,transparent);
  transition:transform .15s,box-shadow .2s,opacity .2s,filter .2s;
}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.soft{background:var(--ac-soft);color:var(--ac);box-shadow:none;padding:9px 14px}
.btn.soft:hover:not(:disabled){filter:none;background:color-mix(in srgb,var(--ac) 16%,transparent)}
.ghost{
  display:grid;place-items:center;width:34px;height:34px;border-radius:10px;flex:none;
  background:transparent;color:var(--mu);border:1px solid var(--bd);cursor:pointer;transition:color .2s,border-color .2s,background .2s;
}
.ghost:hover{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
.busy .ico-i{display:none}
.btn:not(.busy) .spin{display:none}
.err{color:var(--danger);font-size:.88rem}
.err:empty,#st:empty{display:none}
.composer .err{margin-top:10px}

/* ---------- Feed ---------- */
.feed-h{display:flex;align-items:baseline;justify-content:space-between;margin:36px 4px 14px}
.feed-h h2{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:-.01em}
.count{font-size:.8rem;font-weight:600;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:2px 10px}
#feed{display:grid;gap:14px}
.post{padding:16px;transition:box-shadow .25s,border-color .25s;animation:up .4s ease both}
.post:hover{box-shadow:var(--shadow-lg);border-color:var(--bd-2)}
.post .file{align-items:center}
.cap{margin:12px 0 0;white-space:pre-wrap;word-break:break-word}
.media{display:block;margin-top:12px;border-radius:12px;overflow:hidden;background:var(--card-2);border:1px solid var(--bd)}
.media img,.media video{display:block;width:100%;max-height:420px;object-fit:contain}
audio.prev{display:block;width:100%;margin-top:12px}
.post .err{margin-top:10px}

/* States */
.msg{
  text-align:center;padding:44px 20px;color:var(--mu);
  border:1.5px dashed var(--bd-2);border-radius:var(--r);background:color-mix(in srgb,var(--card) 50%,transparent);
}
.msg b{display:block;color:var(--tx);font-size:1rem;margin-bottom:4px}
.msg .e{font-size:2rem;margin-bottom:8px}
.sk{padding:16px}
.sk .file{gap:12px}
.bar{height:12px;border-radius:6px;background:var(--card-2);position:relative;overflow:hidden}
.bar::after,.sk .tile::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--mu) 12%,transparent),transparent);animation:sh 1.3s infinite}
.sk .tile{position:relative;overflow:hidden;background:var(--card-2);border-color:var(--bd)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;
  background:var(--tx);color:var(--bg);box-shadow:var(--shadow-lg);transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--ok)}

footer{text-align:center;color:var(--mu);font-size:.8rem;margin-top:40px}

@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sh{to{transform:translateX(100%)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:480px){
  main{padding-top:28px}
  .hero{gap:12px;align-items:flex-start}
  .logo{width:46px;height:46px;border-radius:14px}
  .row .btn{flex:1}
  .post .btn .lbl{display:none}
  .post .btn.soft{padding:9px 11px}
}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M12 11v6M9.5 13.5 12 11l2.5 2.5"/></svg>
    </div>
    <div>
      <h1>Archivos compartidos</h1>
      <p class="sub">Subí un archivo y aparece como publicación. Cualquiera puede descargarlo.</p>
    </div>
  </header>

  <section class="card composer" aria-label="Nueva publicación">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Elegir archivo">
      <div class="drop-ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16.5h1.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.34 9.5 3.5 3.5 0 0 0 7 16.5h1"/><path d="M12 12v8M9 15l3-3 3 3"/></svg>
      </div>
      <div class="drop-t">Arrastrá un archivo o <u>elegí uno</u></div>
      <div class="meta">Cualquier tipo · hasta 20 MB</div>
    </div>
    <input type="file" id="pick" hidden>

    <div id="sel" class="file sel" hidden>
      <span class="tile" id="selI"></span>
      <div class="grow"><div class="fn" id="selN"></div><div class="meta" id="selS"></div></div>
      <button class="ghost" id="clr" aria-label="Quitar archivo" title="Quitar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <textarea id="cap" placeholder="Escribí algo sobre el archivo (opcional)"></textarea>
    <div class="row">
      <span class="meta" id="st"></span>
      <button class="btn" id="pub" disabled>
        <span class="spin" aria-hidden="true"></span>
        <svg class="ico-i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
        Publicar
      </button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </section>

  <div class="feed-h">
    <h2>Publicaciones</h2>
    <span class="count" id="count" hidden></span>
  </div>
  <div id="feed" aria-live="polite">
    <div class="card sk"><div class="file"><span class="tile"></span><div class="grow"><div class="bar" style="width:55%"></div><div class="bar" style="width:30%;margin-top:8px"></div></div></div></div>
    <div class="card sk"><div class="file"><span class="tile"></span><div class="grow"><div class="bar" style="width:40%"></div><div class="bar" style="width:25%;margin-top:8px"></div></div></div></div>
  </div>

  <footer>Los archivos son públicos: no subas nada privado.</footer>
</main>

<div class="toast" id="toast" role="status">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastT"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURACIÓN: pegá acá tus datos de Supabase ======
const SUPABASE_URL = "https://dtqyneohownxguliiitc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0cXluZW9ob3dueGd1bGlpaXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTc3NTgsImV4cCI6MjEwNzkzMzc1OH0.u6l7LBCiA_gUghkf5wl-FuR3yeSlIK_lnhqkUgw9tKQ";
// ===========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "archivos", MAX = 20 * 1048576;
const $ = s => document.querySelector(s);
let file = null;

const fmt = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB";
const urlOf = path => sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;

// Tipo de archivo → color y etiqueta para el ícono
const EXT = {
  zip: ["zip","rar","7z","tar","gz","bz2","xz"],
  doc: ["doc","docx","odt","rtf","txt","md","pages"],
  xls: ["xls","xlsx","ods","csv","numbers"],
  ppt: ["ppt","pptx","odp","key"]
};
function kind(t, name) {
  t = t || "";
  const ext = name && name.includes(".") ? name.split(".").pop().toLowerCase() : "";
  let k = "etc";
  if (t.startsWith("image/")) k = "img";
  else if (t.startsWith("video/")) k = "vid";
  else if (t.startsWith("audio/")) k = "aud";
  else if (t === "application/pdf" || ext === "pdf") k = "pdf";
  else for (const key in EXT) if (EXT[key].includes(ext)) { k = key; break; }
  const label = (ext && ext.length <= 4 ? ext : ({ img: "IMG", vid: "VID", aud: "AUD", pdf: "PDF" }[k] || "FILE")).toUpperCase();
  return { k, label };
}
function setTile(el, t, name) {
  const { k, label } = kind(t, name);
  el.className = "tile k-" + k;
  el.textContent = label;
}

const rtf = new Intl.RelativeTimeFormat("es", { numeric: "auto" });
function ago(d) {
  const s = (d - Date.now()) / 1000, a = Math.abs(s);
  if (a < 60) return "recién";
  if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
  if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
  if (a < 604800) return rtf.format(Math.round(s / 86400), "day");
  return d.toLocaleDateString("es-AR", { dateStyle: "medium" });
}

let toastTimer;
function toast(text) {
  $("#toastT").textContent = text;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 2600);
}

const DL_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

function stateMsg(emoji, title, text) {
  return '<div class="msg"><div class="e">' + emoji + '</div><b>' + title + '</b>' + text + '</div>';
}

async function load() {
  const { data, error } = await sb.from("posts").select("*").order("created_at", { ascending: false });
  const feed = $("#feed"), count = $("#count");
  if (error) { count.hidden = true; feed.innerHTML = stateMsg("⚠️", "No se pudieron cargar las publicaciones", "Revisá la configuración de Supabase."); return; }
  count.hidden = !data.length;
  count.textContent = data.length;
  if (!data.length) { feed.innerHTML = stateMsg("📭", "Todavía no hay publicaciones", "¡Subí la primera!"); return; }
  feed.innerHTML = "";
  data.forEach((p, i) => {
    const url = urlOf(p.path), t = p.type || "";
    const c = document.createElement("article");
    c.className = "card post";
    c.style.animationDelay = Math.min(i, 8) * 40 + "ms";

    let prev = "";
    if (t.startsWith("image/")) prev = '<a class="media" target="_blank" rel="noopener"><img loading="lazy" alt=""></a>';
    else if (t.startsWith("video/")) prev = '<div class="media"><video controls preload="metadata"></video></div>';
    else if (t.startsWith("audio/")) prev = '<audio class="prev" controls preload="none"></audio>';

    c.innerHTML =
      '<div class="file"><span class="tile"></span><div class="grow"><div class="fn"></div><div class="meta"></div></div>' +
      '<button class="btn soft dl"><span class="spin" aria-hidden="true"></span><span class="ico-i">' + DL_ICON + '</span><span class="lbl">Descargar</span></button></div>' +
      (p.caption ? '<p class="cap"></p>' : "") + prev + '<div class="err"></div>';

    setTile(c.querySelector(".tile"), t, p.name);
    const fn = c.querySelector(".fn"); fn.textContent = p.name; fn.title = p.name;
    const d = new Date(p.created_at);
    const meta = c.querySelector(".file .meta");
    meta.textContent = fmt(p.size) + " · " + ago(d);
    meta.title = d.toLocaleString("es-AR", { dateStyle: "medium", timeStyle: "short" });
    if (p.caption) c.querySelector(".cap").textContent = p.caption;
    const m = c.querySelector("img,video,audio"); if (m) m.src = url;
    const a = c.querySelector("a.media"); if (a) a.href = url;

    const err = c.querySelector(".err"), btn = c.querySelector(".dl");
    btn.setAttribute("aria-label", "Descargar " + p.name);
    btn.onclick = async () => {
      btn.disabled = true; btn.classList.add("busy"); err.textContent = "";
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob); link.download = p.name;
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 5000);
      } catch (x) { err.textContent = "No se pudo descargar. Probá de nuevo."; }
      btn.disabled = false; btn.classList.remove("busy");
    };
    feed.appendChild(c);
  });
}

function setFile(f) {
  $("#err").textContent = "";
  if (!f) { file = null; $("#sel").hidden = true; $("#drop").hidden = false; $("#pub").disabled = true; return; }
  if (f.size > MAX) { $("#err").textContent = "El archivo supera los 20 MB."; return; }
  file = f;
  setTile($("#selI"), f.type, f.name);
  $("#selN").textContent = f.name; $("#selN").title = f.name;
  $("#selS").textContent = fmt(f.size);
  $("#sel").hidden = false; $("#drop").hidden = true; $("#pub").disabled = false;
}

const drop = $("#drop");
drop.onclick = () => $("#pick").click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#pick").click(); } };
$("#pick").onchange = e => { setFile(e.target.files[0]); e.target.value = ""; };
$("#clr").onclick = () => setFile(null);
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("on"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("on"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

$("#pub").onclick = async () => {
  if (!file) return;
  const pub = $("#pub");
  pub.disabled = true; pub.classList.add("busy"); $("#clr").disabled = true;
  $("#st").textContent = "Subiendo…"; $("#err").textContent = "";
  try {
    const safe = file.name.replace(/[^\w.\-]+/g, "_");
    const path = crypto.randomUUID() + "-" + safe;
    const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || "application/octet-stream" });
    if (up.error) throw up.error;
    const ins = await sb.from("posts").insert({ name: file.name, path, size: file.size, type: file.type || null, caption: $("#cap").value.trim() || null });
    if (ins.error) throw ins.error;
    $("#cap").value = ""; setFile(null); $("#st").textContent = "";
    toast("¡Publicado!");
    await load();
  } catch (e) {
    $("#err").textContent = "No se pudo publicar" + (e && e.message ? ": " + e.message : ".");
    $("#st").textContent = ""; pub.disabled = false;
  }
  pub.classList.remove("busy"); $("#clr").disabled = false;
};
load();
</script>
</body>
</html>
